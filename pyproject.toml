[project]
name = "vidi-plugins"
version = "0.0.1"
description = "Vidi skills plugin for Claude Code and Codex"
readme = "README.md"
classifiers = ["Private :: Do Not Upload"]
# Skill scripts run under whatever `python3` the host has; keep them portable.
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.1.0,<10",
  "ruff>=0.15.20,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
